name: Evening Meditation

on:
  schedule:
    # Fallback only. Since Aug 2026 GitHub cron fires hours late or not at all;
    # the primary trigger is cron-job.org calling workflow_dispatch.
    # The guard job below makes a second trigger harmless.
    # 17:30 UTC = 20:30 MSK — last post before quiet hours
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if already delivered recently'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.delivered.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - id: delivered
        uses: ./.github/actions/skip-if-delivered
        with:
          window-hours: 20

  post:
    needs: guard
    if: needs.guard.outputs.skip != 'true' || inputs.force
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Restore meditation cache
        uses: actions/cache@v4
        with:
          path: python/output/meditation_posted.json
          key: meditation-posted-${{ github.run_id }}
          restore-keys: meditation-posted-

      - name: Post evening meditation
        working-directory: python
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python main.py meditation
