name: System Design Daily

on:
  schedule:
    # Fallback only. Since Aug 2026 GitHub cron fires hours late or not at all;
    # the primary trigger is cron-job.org calling workflow_dispatch.
    # The guard job skips this fallback run if cron-job.org already delivered.
    # 09:00 UTC = 12:00 MSK
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.delivered.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - id: delivered
        uses: ./.github/actions/skip-if-delivered
        with:
          window-hours: 20

  post:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Restore system-design state
        uses: actions/cache@v4
        with:
          path: python/output/system_design_state.json
          key: system-design-state-${{ github.run_id }}
          restore-keys: system-design-state-

      - name: Post system design topic
        working-directory: python
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python main.py system-design
