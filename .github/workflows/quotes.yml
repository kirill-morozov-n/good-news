name: Daily Quotes

on:
  schedule:
    # Fallback only. Since Aug 2026 GitHub cron fires hours late or not at all;
    # the primary trigger is cron-job.org calling workflow_dispatch.
    # The guard job skips this fallback run if cron-job.org already delivered.
    # 03:00 UTC (06:00 MSK) and 16:00 UTC (19:00 MSK)
    - cron: '0 3 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.delivered.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - id: delivered
        uses: ./.github/actions/skip-if-delivered
        with:
          window-hours: 10

  post:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Restore quotes cache
        uses: actions/cache@v4
        with:
          path: python/output/quotes_posted.json
          key: quotes-posted-${{ github.run_id }}
          restore-keys: quotes-posted-

      - name: Post quote
        working-directory: python
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python main.py quote
